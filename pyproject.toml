[build-system]
requires = ["setuptools==67.8.0", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-rest-api-client"
version = "0.1.0"
description = "A small, extensible REST API client inspired by RestApiClientSharp"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Reitberger"}]
dependencies = ["requests>=2.25,<2.32"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["py_rest_api_client*"]
